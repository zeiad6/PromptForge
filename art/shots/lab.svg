<text x="20" y="78" font-family="DejaVu Sans" font-size="11.5" fill="#9AA7BD">On-device · SmolLM2 135M · offline</text><rect x="288" y="64" width="92" height="22" rx="11" fill="#34D399" fill-opacity="0.15"/><text x="334" y="79" font-family="DejaVu Sans" font-size="9.5" fill="#34D399" font-weight="bold" text-anchor="middle" opacity="1">● connected</text><rect x="150" y="104" width="230" height="52" rx="16" fill="url(#brand)" opacity="0.92"/><text x="166" y="126" font-family="DejaVu Sans" font-size="10.5" fill="#FFFFFF" text-anchor="start" opacity="1">Summarize the key ideas of quantum</text><text x="166" y="142" font-family="DejaVu Sans" font-size="10.5" fill="#FFFFFF" text-anchor="start" opacity="1">computing in simple words.</text><rect x="20" y="172" width="300" height="148" rx="16" fill="#0F1628" fill-opacity="0.92" stroke="#FFFFFF14" stroke-width="1"/><text x="36" y="196" font-family="DejaVu Sans" font-size="10.5" fill="#E7ECF5" text-anchor="start" opacity="1">Quantum computers use qubits, which can</text><text x="36" y="213" font-family="DejaVu Sans" font-size="10.5" fill="#E7ECF5" text-anchor="start" opacity="1">be 0 and 1 at once — that "superposition"</text><text x="36" y="230" font-family="DejaVu Sans" font-size="10.5" fill="#E7ECF5" text-anchor="start" opacity="1">lets them explore many solutions together.</text><text x="36" y="247" font-family="DejaVu Sans" font-size="10.5" fill="#E7ECF5" text-anchor="start" opacity="1">Entanglement links qubits so they behave</text><text x="36" y="264" font-family="DejaVu Sans" font-size="10.5" fill="#E7ECF5" text-anchor="start" opacity="1">as one system, and interference amplifies</text><text x="36" y="281" font-family="DejaVu Sans" font-size="10.5" fill="#E7ECF5" text-anchor="start" opacity="1">right answers. They excel at simulation and</text><text x="36" y="294" font-family="DejaVu Sans" font-size="10.5" fill="#22D3EE" text-anchor="start" opacity="1">cryptography ▌</text><text x="36" y="310" font-family="DejaVu Sans" font-size="8.5" fill="#66748F" text-anchor="start" opacity="1">streaming from device…</text><circle cx="34" cy="344" r="3" fill="#9AA7BD"/><circle cx="46" cy="344" r="3" fill="#9AA7BD" opacity="0.6"/><circle cx="58" cy="344" r="3" fill="#9AA7BD" opacity="0.3"/><rect x="20" y="712" width="316" height="46" rx="16" fill="#0F1628" stroke="#FFFFFF14" stroke-width="1"/><text x="36" y="740" font-family="DejaVu Sans" font-size="11" fill="#66748F" text-anchor="start" opacity="1">Ask anything…</text><circle cx="358" cy="735" r="20" fill="url(#brand)"/><path d="M352 735 l12 -6 -12 6 0 5 4 -3" fill="#FFFFFF"/><rect x="14" y="786" width="372" height="58" rx="24" fill="#121A30" fill-opacity="0.97" stroke="#FFFFFF14" stroke-width="1"/><path d="M39.0 807 l6 -6 l6 6 v7 h-12 z" fill="none" stroke="#9AA7BD" stroke-width="1.6"/><text x="45.0" y="833" font-family="DejaVu Sans" font-size="6.8" fill="#66748F" text-anchor="middle" opacity="1">Home</text><rect x="101.0" y="801" width="12" height="12" rx="2" fill="none" stroke="#9AA7BD" stroke-width="1.6"/><line x1="101.0" y1="805" x2="113.0" y2="805" stroke="#9AA7BD" stroke-width="1.4"/><text x="107.0" y="833" font-family="DejaVu Sans" font-size="6.8" fill="#66748F" text-anchor="middle" opacity="1">Temps</text><path d="M163.0 813 v-9 l7 -4 0 13 z" fill="none" stroke="#9AA7BD" stroke-width="1.6" stroke-linejoin="round"/><text x="169.0" y="833" font-family="DejaVu Sans" font-size="6.8" fill="#66748F" text-anchor="middle" opacity="1">Build</text><rect x="215.0" y="794" width="32" height="26" rx="10" fill="url(#brand)"/><path d="M226.0 802 l10 5 -10 5 z" fill="#FFFFFF"/><text x="231.0" y="833" font-family="DejaVu Sans" font-size="6.8" fill="#E7ECF5" font-weight="bold" text-anchor="middle" opacity="1">Lab</text><rect x="287.0" y="801" width="5" height="12" rx="1.5" fill="#9AA7BD"/><rect x="294.0" y="804" width="5" height="9" rx="1.5" fill="#9AA7BD"/><text x="293.0" y="833" font-family="DejaVu Sans" font-size="6.8" fill="#66748F" text-anchor="middle" opacity="1">Library</text><circle cx="355.0" cy="807" r="4.5" fill="none" stroke="#9AA7BD" stroke-width="1.6"/><circle cx="355.0" cy="807" r="1.4" fill="#9AA7BD"/><text x="355.0" y="833" font-family="DejaVu Sans" font-size="6.8" fill="#66748F" text-anchor="middle" opacity="1">Settings</text></svg>